<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="BugLens - AI-powered bug and error analysis for developers."
    />

    <meta
      name="theme-color"
      content="#2563eb"
    />

    <script>
      (() => {
        try {
          const key = "buglens-theme";
          const savedTheme =
            localStorage.getItem(key) || "system";

          const prefersDark =
            window.matchMedia &&
            window.matchMedia(
              "(prefers-color-scheme: dark)",
            ).matches;

          const isDark =
            savedTheme === "dark" ||
            (savedTheme === "system" && prefersDark);

          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.add("light");
          }
        } catch {
          document.documentElement.classList.add("light");
        }
      })();
    </script>

    <title>BugLens</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
